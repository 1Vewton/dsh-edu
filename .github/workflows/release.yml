# Release workflow: publish this bundle to npm and cut a GitHub Release.
#
# Triggers:
#   - push of a version tag: `git tag v0.1.0 && git push origin v0.1.0`
#   - manual dispatch, which defaults to a dry run (build, test and pack only)
#
# What ships is the committed `lib/` output, so the workflow refuses to release
# a tree whose committed build is stale. Publishing authenticates with the
# `NPM_TOKEN` repository secret and attaches a provenance attestation; see the
# README's "Releasing" section for the one-time secret setup and for switching
# to npm trusted publishing (OIDC) once the package exists on npm.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack without publishing
        type: boolean
        default: true
      tag:
        description: 'Tag to finish releasing, e.g. v0.1.0 (leave empty to only build and pack)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.7.0'
  PACKAGE_NAME: 'dsh-edu-mode'
  # A tag push releases that tag; a manual dispatch can name one instead, which
  # is how a release that published to npm but failed before creating its GitHub
  # Release gets finished — without moving the tag, and without replaying the
  # workflow file as it existed inside that tag. Every input is read through
  # `github.event.inputs` (empty on a push) rather than the `inputs` context,
  # which is only guaranteed to resolve for a dispatch.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      # Create the GitHub Release for this tag.
      contents: write
      # Sign the provenance attestation npm publishes with the package.
      id-token: write
    steps:
      # The default shallow clone is enough: nothing here reads git history.
      # persist-credentials stays off; the release step authenticates with the
      # workflow token passed explicitly.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # pnpm is installed outside the workspace (`dest`), so the checkout it
      # operates on contains only what the repository tracks.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          # Never cache a release build's dependency tree.
          package-manager-cache: false

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # `lib/` is committed so that installing the bundle needs no build-script
      # consent from the user. That only works while it matches `src/`, so a
      # stale build is a release blocker rather than a silently shipped bug.
      - name: Build and verify the committed lib/ is current
        run: |
          pnpm build
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ does not match src/ — run 'pnpm build' and commit lib/"
            git diff --stat -- lib
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Check the release version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only a run that names a tag has a tag/version agreement to check.
          if [ "${GITHUB_EVENT_NAME}" = 'push' ] || [ -n "${INPUT_TAG}" ]; then
            tag="${TAG#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag ${TAG} does not match package.json version $version"
              exit 1
            fi
          fi
          if npm view "${PACKAGE_NAME}@${version}" version >/dev/null 2>&1; then
            # Already on npm is NOT a failure: re-running a release for its own
            # tag must still be able to finish the GitHub Release, which is
            # exactly the state a half-completed release leaves behind.
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${version} is already on npm — skipping the publish step"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing ${PACKAGE_NAME}@${version}"

      - name: Publish
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::the NPM_TOKEN repository secret is missing — add an npm automation token under Settings → Secrets and variables → Actions"
            exit 1
          fi
          npm publish --access public --provenance

      - name: Pack the tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          # Storefronts (dsh-market and the curated registry) point at a
          # VERSION-FREE asset name: `releases/latest/download/<name>` resolves
          # `latest` at request time but takes the filename literally, so a
          # versioned asset would 404 the moment the next release ships.
          version=$(node -p "require('./package.json').version")
          cp "dist/${PACKAGE_NAME}-${version}.tgz" "dist/${PACKAGE_NAME}.tgz"
          ls -l dist

      - name: Create or update the GitHub Release
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh --version
          ls -l dist
          title="${PACKAGE_NAME} v${{ steps.version.outputs.version }}"
          # Attaching first covers every state a hand-started or half-finished
          # release can leave behind (a draft, or a release already holding this
          # tag); creating is the fallback when nothing holds the tag yet. Both
          # make a re-run idempotent instead of failing on "already exists".
          if gh release upload "${TAG}" dist/*.tgz --clobber; then
            echo "attached the tarballs to the existing release for ${TAG}"
          else
            gh release create "${TAG}" --title "$title" --generate-notes dist/*.tgz
          fi

      - name: Summary
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          {
            echo "### ${PACKAGE_NAME}@${{ steps.version.outputs.version }}"
            echo
            if [ "${{ github.event_name }}" = 'push' ]; then
              echo "Published to npm and released on GitHub."
            elif [ -n "${INPUT_TAG}" ]; then
              echo "Finished the release for ${INPUT_TAG}. npm publish only runs on a tag push."
            else
              echo "Dry run: nothing was published. Re-dispatch with \`dry_run\` off, or push a \`v*\` tag."
            fi
            echo
            echo '```'
            npm pack --dry-run 2>&1 | sed -n '/Tarball Contents/,/total files/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
